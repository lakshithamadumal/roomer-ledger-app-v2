name: Roomer
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.10.0
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/roomer-light-logo.png
    - assets/welcome-screen-illustration.png
    - assets/roomer-green-logo.png
    - assets/icon/
    - assets/admin-approval-screen-illustration.png
    - assets/waiting-screen-illustration.png